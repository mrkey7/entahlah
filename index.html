<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background-color: #fff;
      background-image:
        linear-gradient(45deg, #c8c8c8 25%, transparent 25%),
        linear-gradient(-45deg, #c8c8c8 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #c8c8c8 75%),
        linear-gradient(-45deg, transparent 75%, #c8c8c8 75%);
      background-size: 24px 24px;
      background-position: 0 0, 0 12px, 12px -12px, -12px 0;
      background-repeat: repeat;
    }

    .emergency-icon {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 36px;
      height: 36px;
      color: #fff;
      mix-blend-mode: difference;
      cursor: grab;
      touch-action: none;
      user-select: none;
      z-index: 1000;
    }

    .emergency-icon:active {
      cursor: grabbing;
    }

    .emergency-icon svg {
      display: block;
      width: 100%;
      height: 100%;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <span class="emergency-icon" role="img" aria-label="Emergency">
    <svg viewBox="0 0 36 36" aria-hidden="true">
      <circle cx="18" cy="18" r="15"></circle>
      <path d="M18 10v16M10 18h16"></path>
    </svg>
  </span>

  <script>
    const icon = document.querySelector(".emergency-icon");
    let dragging = false;
    let offsetX = 0;
    let offsetY = 0;

    async function loadIconPosition() {
      try {
        const response = await fetch("/ikon.json", { cache: "no-store" });
        if (!response.ok) return;

        const position = await response.json();
        if (Number.isInteger(position.left) && Number.isInteger(position.top)) {
          icon.style.left = position.left + "px";
          icon.style.top = position.top + "px";
          icon.style.right = "auto";
        }
      } catch (error) {
        console.warn("Posisi ikon belum dapat dimuat:", error);
      }
    }

    function moveIcon(event) {
      if (!dragging) return;

      const maxX = window.innerWidth - icon.offsetWidth;
      const maxY = window.innerHeight - icon.offsetHeight;
      const left = Math.max(0, Math.min(maxX, event.clientX - offsetX));
      const top = Math.max(0, Math.min(maxY, event.clientY - offsetY));

      icon.style.left = left + "px";
      icon.style.top = top + "px";
      icon.style.right = "auto";
    }

    async function saveIconPosition() {
      const position = {
        left: Math.round(icon.offsetLeft),
        top: Math.round(icon.offsetTop)
      };

      try {
        const response = await fetch("/ikon.json", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(position)
        });

        if (!response.ok) throw new Error("HTTP " + response.status);
      } catch (error) {
        console.error("Posisi ikon gagal disimpan:", error);
      }
    }

    icon.addEventListener("pointerdown", event => {
      dragging = true;
      const rect = icon.getBoundingClientRect();
      offsetX = event.clientX - rect.left;
      offsetY = event.clientY - rect.top;
      icon.setPointerCapture(event.pointerId);
      event.preventDefault();
    });

    icon.addEventListener("pointermove", moveIcon);

    icon.addEventListener("pointerup", async event => {
      if (!dragging) return;
      dragging = false;
      icon.releasePointerCapture(event.pointerId);
      await saveIconPosition();
    });

    icon.addEventListener("pointercancel", () => {
      dragging = false;
    });

    loadIconPosition();
  </script>
</body>
</html>
