<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background-color: #fff;
      background-image:
        linear-gradient(45deg, #c8c8c8 25%, transparent 25%),
        linear-gradient(-45deg, #c8c8c8 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #c8c8c8 75%),
        linear-gradient(-45deg, transparent 75%, #c8c8c8 75%);
      background-size: 24px 24px;
      background-position: 0 0, 0 12px, 12px -12px, -12px 0;
      background-repeat: repeat;
    }

    .emergency-icon {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 36px;
      height: 36px;
      color: #fff;
      mix-blend-mode: difference;
      pointer-events: none;
    }

    .emergency-icon svg {
      display: block;
      width: 100%;
      height: 100%;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>
  <span class="emergency-icon" role="img" aria-label="Emergency">
    <svg viewBox="0 0 36 36" aria-hidden="true">
      <circle cx="18" cy="18" r="15"></circle>
      <path d="M18 10v16M10 18h16"></path>
    </svg>
  </span>
</body>
</html>
